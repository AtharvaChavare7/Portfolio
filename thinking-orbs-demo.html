<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="clock-favicon.js"></script>
    <title>Thinking Orbs demo</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #070707;
        color: rgba(251, 251, 251, 0.72);
        font: 16px/1.4 system-ui, sans-serif;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 9px 32px 9px 9px;
        border-radius: 999px;
        background: rgba(29, 29, 29, 0.42);
        box-shadow:
          inset 0 0 0 1px rgba(44, 47, 54, 0.31),
          inset 0 0 50px rgba(255, 255, 255, 0.012);
      }

      .pill span:last-child {
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import { createElement } from "./vendor/thinking-orbs/react.mjs";
      import { createRoot } from "./vendor/thinking-orbs/react-dom-client.mjs";
      import { ThinkingOrb } from "./vendor/thinking-orbs/thinking-orbs.bundle.mjs";

      createRoot(document.getElementById("root")).render(
        createElement(
          "div",
          { className: "pill" },
          createElement(ThinkingOrb, {
            state: "searching",
            size: 64,
            theme: "dark",
            "aria-label": "Searching project files",
          }),
          createElement("span", null, "Searching…")
        )
      );
    </script>
  </body>
</html>
