<!DOCTYPE html>
<html lang="en" class="footer-demo">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="clock-favicon.js"></script>
  <title>Atharva — Name Reveal Footer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Geist+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/font.css">
  <link rel="stylesheet" href="assets/footer/atharva-reveal.css">
</head>
<body class="footer-demo">
  <div class="demo-page">
    <section class="footer-panel" aria-label="Footer links">
      <div class="footer-panel__inner">
        <div class="footer-panel__row">
          <div class="footer-panel__hero">
            <h2 class="footer-panel__headline">
              <span class="footer-panel__headline-line">
                Let’s BUILD
                <button class="footer-panel__folder-wrap" type="button" aria-label="AI build tools: Claude, Cursor, Codex">
                  <span class="footer-panel__folder-scene" aria-hidden="true">
                    <img class="footer-panel__folder-back" src="assets/footer/v2/folder-back-tab.svg" alt="" width="78" height="55" decoding="async">
                    <span class="footer-panel__folder-burst">
                      <img class="footer-panel__tool footer-panel__tool--claude" src="assets/footer/v2/tool-claude.svg" alt="" width="21" height="21" decoding="async">
                      <img class="footer-panel__tool footer-panel__tool--cursor" src="assets/footer/v2/tool-cursor.svg" alt="" width="21" height="21" decoding="async">
                      <span class="footer-panel__tool footer-panel__tool--codex">
                        <span class="footer-panel__tool-tile footer-panel__tool-tile--codex">
                          <img src="assets/footer/v2/tool-codex.svg" alt="" width="12" height="12" decoding="async">
                        </span>
                      </span>
                    </span>
                    <img class="footer-panel__folder-front" src="assets/footer/v2/folder-front-body.svg" alt="" width="78" height="50" decoding="async">
                    <img class="footer-panel__folder-mark" src="assets/footer/v2/folder-front-mark.svg" alt="" width="19" height="17" decoding="async">
                  </span>
                </button>
              </span>
              <span class="footer-panel__headline-line">something meaningful</span>
            </h2>

            <div class="footer-panel__actions">
              <button class="footer-panel__btn footer-panel__btn--email" type="button" data-copy-email="hello@atharvachavare.com">
                <span class="footer-panel__btn-label">Copy Email ID</span>
                <img class="footer-panel__btn-arrow" src="assets/footer/v2/arrow-dark.svg" alt="" width="19" height="19" decoding="async">
              </button>
              <a class="footer-panel__btn footer-panel__btn--resume" href="#" aria-label="Resume (coming soon)">
                <span class="footer-panel__btn-label">Resume</span>
                <img class="footer-panel__btn-arrow" src="assets/footer/v2/arrow-light.svg" alt="" width="19" height="19" decoding="async">
              </a>
            </div>
          </div>

          <nav class="footer-panel__links" aria-label="Links and social profiles">
            <a class="footer-panel__link" href="interaction-library.html">
              <span class="footer-panel__link-main">
                <span class="footer-panel__icon footer-panel__icon--white">
                  <img src="assets/footer/v2/icon-interaction-library.svg" alt="" width="27" height="26" decoding="async">
                </span>
                <span class="footer-panel__link-label">Interaction Library</span>
              </span>
              <span class="footer-panel__link-arrow" aria-hidden="true">↗</span>
            </a>
            <a class="footer-panel__link" href="https://medium.com/@chavareatharva" target="_blank" rel="noreferrer">
              <span class="footer-panel__link-main">
                <span class="footer-panel__icon footer-panel__icon--white">
                  <img src="assets/footer/v2/icon-medium.png" alt="" width="31" height="31" decoding="async">
                </span>
                <span class="footer-panel__link-label">Medium</span>
              </span>
              <span class="footer-panel__link-arrow" aria-hidden="true">↗</span>
            </a>
            <a class="footer-panel__link" href="https://www.linkedin.com/in/atharva-chavare-363278248" target="_blank" rel="noreferrer">
              <span class="footer-panel__link-main">
                <span class="footer-panel__icon footer-panel__icon--linkedin">
                  <img src="assets/footer/v2/icon-linkedin.svg" alt="" width="33" height="33" decoding="async">
                </span>
                <span class="footer-panel__link-label">LinkedIn</span>
              </span>
              <span class="footer-panel__link-arrow" aria-hidden="true">↗</span>
            </a>
            <a class="footer-panel__link" href="https://x.com/" target="_blank" rel="noreferrer">
              <span class="footer-panel__link-main">
                <span class="footer-panel__icon footer-panel__icon--twitter">
                  <img src="assets/footer/v2/icon-twitter.svg" alt="" width="45" height="45" decoding="async">
                </span>
                <span class="footer-panel__link-label">Twitter</span>
              </span>
              <span class="footer-panel__link-arrow" aria-hidden="true">↗</span>
            </a>
            <a class="footer-panel__link" href="https://www.behance.net/atharvachavare" target="_blank" rel="noreferrer">
              <span class="footer-panel__link-main">
                <span class="footer-panel__icon footer-panel__icon--behance">
                  <img src="assets/footer/v2/icon-behance.svg" alt="" width="22" height="15" decoding="async">
                </span>
                <span class="footer-panel__link-label">Behance</span>
              </span>
              <span class="footer-panel__link-arrow" aria-hidden="true">↗</span>
            </a>
          </nav>
        </div>

        <div class="footer-panel__divider" aria-hidden="true">
          <img src="assets/footer/v2/divider-line.svg" alt="" width="1664" height="1" decoding="async">
        </div>
      </div>
    </section>

    <footer class="name-footer" aria-label="Atharva name reveal footer">
      <div class="name-footer__stage is-idle">
        <div class="name-footer__media" aria-hidden="true">
          <video class="name-footer__video" autoplay muted loop playsinline preload="auto">
            <source src="assets/footer/firefly.mp4" type="video/mp4">
          </video>
        </div>
        <canvas class="name-footer__canvas" aria-hidden="true"></canvas>
        <span class="name-footer__cursor" aria-hidden="true"></span>
        <div class="name-footer__fallback" hidden>Loading texture video…</div>
      </div>
    </footer>
  </div>

  <script src="assets/footer/atharva-reveal.js"></script>
</body>
</html>
