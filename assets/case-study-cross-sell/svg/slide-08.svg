<text fill="#6F3BC8" style="white-space: pre" xml:space="preserve" font-family="Spotify Mix" font-size="22.2571" letter-spacing="0em"><tspan x="120" y="637.327">Strategic Placement</tspan></text>
<text fill="#640FCB" style="white-space: pre" xml:space="preserve" font-family="Gilroy" font-size="16" letter-spacing="-0.08px"><tspan x="120" y="682.217">Placing interventions within high-attention </tspan><tspan x="120" y="706.317">zones like confirmation screens or listing </tspan><tspan x="120" y="730.417">cards increases engagement and </tspan><tspan x="120" y="754.517">response rates.</tspan></text>
