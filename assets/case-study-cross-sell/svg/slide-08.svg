<text fill="#1E65C6" style="white-space: pre" xml:space="preserve" font-family="Spotify Mix" font-size="22" letter-spacing="0.117784px"><tspan x="1034.91" y="281.378">Clarity &#38; Simplicity Of Offers</tspan></text>
<text fill="#0F5ECB" style="white-space: pre" xml:space="preserve" font-family="Gilroy" font-size="16" letter-spacing="-0.08px"><tspan x="1034.91" y="327.826">Clearly worded, visually concise offers </tspan><tspan x="1034.91" y="351.926">reduce cognitive effort and help users </tspan><tspan x="1034.91" y="376.026">quickly understand the value being </tspan><tspan x="1034.91" y="400.126">presented.</tspan></text>
