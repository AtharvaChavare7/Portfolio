<text fill="#1E65C6" style="white-space: pre" xml:space="preserve" font-family="Spotify Mix" font-size="22" letter-spacing="0.117784px"><tspan x="120" y="281.378">Entry Points For Cross-</tspan><tspan x="120" y="312.267">Selling, Improving Timing</tspan></text>
<text fill="#0F5ECB" style="white-space: pre" xml:space="preserve" font-family="Gilroy" font-size="16" letter-spacing="-0.08px"><tspan x="120" y="358.826">Introducing offers at contextually relevant </tspan><tspan x="120" y="382.926">moments in the user journey ensures </tspan><tspan x="120" y="407.026">higher visibility without disrupting the </tspan><tspan x="120" y="431.126">primary task flow.</tspan></text>
