<text fill="#6F3BC8" style="white-space: pre" xml:space="preserve" font-family="Spotify Mix" font-size="22.2571" letter-spacing="0em"><tspan x="1034.91" y="637.327">Making it feel exclusive</tspan></text>
<text fill="#640FCB" style="white-space: pre" xml:space="preserve" font-family="Gilroy" font-size="16" letter-spacing="-0.08px"><tspan x="1034.91" y="682.217">Framing offers as limited or user-specific </tspan><tspan x="1034.91" y="706.317">builds perceived value and urgency, </tspan><tspan x="1034.91" y="730.417">encouraging users to act on the deal.</tspan></text>
