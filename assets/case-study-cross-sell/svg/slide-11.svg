<text fill="#071932" style="white-space: pre" xml:space="preserve" font-family="Gilroy" font-size="20" letter-spacing="0px"><tspan x="1466" y="369.481">The strip is intentionally lightweight </tspan><tspan x="1466" y="395.481">and passive, </tspan><tspan x="1580.69" y="447.481"> </tspan></text>
