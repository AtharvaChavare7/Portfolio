<text fill="#071932" style="white-space: pre" xml:space="preserve" font-family="Gilroy" font-size="20" letter-spacing="0px"><tspan x="120" y="682.969">Research showed </tspan><tspan x="157.559" y="734.969"> after booking flights, making this </tspan><tspan x="120" y="760.969">nudge </tspan></text>
<text fill="#257EF8" style="white-space: pre" xml:space="preserve" font-family="Spotify Mix" font-size="24" letter-spacing="-0.08px"><tspan x="1466" y="600.506">Helping users understand </tspan><tspan x="1466" y="632.506">why they get the discount</tspan></text>
<text fill="#071932" style="white-space: pre" xml:space="preserve" font-family="Gilroy" font-size="20" letter-spacing="0px"><tspan x="1466" y="670.468">Introducing the intervention </tspan><tspan x="1634.34" y="748.468">, making future </tspan><tspan x="1466" y="774.468">nudges feel logical and earned.</tspan></text>
