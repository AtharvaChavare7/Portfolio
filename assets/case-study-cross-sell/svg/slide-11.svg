<text fill="#071932" style="white-space: pre" xml:space="preserve" font-family="Gilroy" font-size="20" letter-spacing="0px"><tspan x="120" y="437.47">Helps </tspan><tspan x="196.797" y="489.47"> while users are already on </tspan><tspan x="120" y="515.47">the platform.</tspan></text>
