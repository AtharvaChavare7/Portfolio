<svg width="1920" height="1076" viewBox="0 0 1920 1076" fill="none" xmlns="http://www.w3.org/2000/svg">
<rect width="1920" height="1075.97" fill="white"/>
<text fill="#257EF8" fill-opacity="0.5" style="white-space: pre" xml:space="preserve" font-family="Spotify Mix" font-size="20" font-weight="bold" letter-spacing="4px"><tspan x="120" y="100.622">USER SURVEY AND INTERVIEW</tspan></text>
<text fill="#257EF8" style="white-space: pre" xml:space="preserve" font-family="Spotify Mix" font-size="40" font-weight="bold" letter-spacing="-0.999273px"><tspan x="120" y="155.712">Major Insights</tspan></text>
<g filter="url(#filter0_d_1_9531)">
<rect x="120" y="200" width="528" height="221.323" rx="44.9293" fill="#FBFDFF" shape-rendering="crispEdges"/>
<rect x="118.128" y="198.128" width="531.744" height="225.067" rx="46.8013" stroke="#CEDDFF" stroke-width="3.74411" shape-rendering="crispEdges"/>
<text fill="#1E65C6" style="white-space: pre" xml:space="preserve" font-family="Spotify Mix" font-size="26" letter-spacing="0.117784px"><tspan x="149.953" y="262.103">Price And Trust</tspan></text>
<text fill="#0F5ECB" style="white-space: pre" xml:space="preserve" font-family="Gilroy" font-size="20" letter-spacing="0.28px"><tspan x="149.953" y="324.362">Users choose where to book based on final price </tspan><tspan x="149.953" y="350.362">and how much they trust it, making transparency </tspan><tspan x="149.953" y="376.362">critical.</tspan></text>
</g>
<g filter="url(#filter1_d_1_9531)">
<rect x="120" y="469.323" width="528" height="214.882" rx="44.9293" fill="#FBFDFF" shape-rendering="crispEdges"/>
<rect x="118.128" y="467.451" width="531.744" height="218.626" rx="46.8013" stroke="#CEDDFF" stroke-width="3.74411" shape-rendering="crispEdges"/>
<text fill="#1E65C6" style="white-space: pre" xml:space="preserve" font-family="Spotify Mix" font-size="48" font-weight="bold" letter-spacing="0em"><tspan x="149.953" y="554.78">71%</tspan></text>
<text fill="#0F5ECB" style="white-space: pre" xml:space="preserve" font-family="Gilroy" font-size="20" letter-spacing="0.28px"><tspan x="149.953" y="587.244">users said they did not see any hotel offers after </tspan><tspan x="149.953" y="613.244">booking a flight, even though offers were </tspan><tspan x="149.953" y="639.244">present.</tspan></text>
</g>
<g filter="url(#filter2_d_1_9531)">
<rect x="120" y="732.205" width="528" height="188.882" rx="44.9293" fill="#FBFDFF" shape-rendering="crispEdges"/>
<rect x="118.128" y="730.333" width="531.744" height="192.626" rx="46.8013" stroke="#CEDDFF" stroke-width="3.74411" shape-rendering="crispEdges"/>
<text fill="#1E65C6" style="white-space: pre" xml:space="preserve" font-family="Spotify Mix" font-size="48" font-weight="bold" letter-spacing="0em"><tspan x="149.953" y="817.662">91%</tspan></text>
<text fill="#0F5ECB" style="white-space: pre" xml:space="preserve" font-family="Gilroy" font-size="20" letter-spacing="0.28px"><tspan x="149.953" y="850.126">users said yes or maybe when asked if they&#39;d </tspan><tspan x="149.953" y="876.126">want combo offers for flights and hotels.</tspan></text>
</g>
<g filter="url(#filter3_d_1_9531)">
<rect x="696" y="200" width="528" height="252.323" rx="44.9293" fill="#FDFBFF" shape-rendering="crispEdges"/>
<rect x="694.128" y="198.128" width="531.744" height="256.067" rx="46.8013" stroke="#E3CEFF" stroke-width="3.74411" shape-rendering="crispEdges"/>
<text fill="#3D1EC6" style="white-space: pre" xml:space="preserve" font-family="Spotify Mix" font-size="26.2088" letter-spacing="0.117784px"><tspan x="725.953" y="262.177">Offline Bookers Lacked Awarness Of </tspan><tspan x="725.953" y="293.065">Offers</tspan></text>
<text fill="#3E0FCB" style="white-space: pre" xml:space="preserve" font-family="Gilroy" font-size="20" letter-spacing="0.28px"><tspan x="725.953" y="355.362">Many users, especially offline hotel bookers, </tspan><tspan x="725.953" y="381.362">never returned to the app after booking flights </tspan><tspan x="725.953" y="407.362">as pre-booking interventions did not exist.</tspan></text>
</g>
<g filter="url(#filter4_d_1_9531)">
<rect x="696" y="500.323" width="528" height="195.323" rx="44.9293" fill="#FDFBFF" shape-rendering="crispEdges"/>
<rect x="694.128" y="498.451" width="531.744" height="199.067" rx="46.8013" stroke="#E3CEFF" stroke-width="3.74411" shape-rendering="crispEdges"/>
<text fill="#3D1EC6" style="white-space: pre" xml:space="preserve" font-family="Spotify Mix" font-size="26.2088" letter-spacing="0.117784px"><tspan x="725.953" y="562.5">Recommendations Felt Irrelevant</tspan></text>
<text fill="#3E0FCB" style="white-space: pre" xml:space="preserve" font-family="Gilroy" font-size="20" font-weight="bold" letter-spacing="0.28px"><tspan x="725.953" y="624.665">Hotel options did not match user location or </tspan><tspan x="725.953" y="650.665">intent, reducing interest in exploring further.</tspan></text>
</g>
<g filter="url(#filter5_d_1_9531)">
<rect x="696" y="743.646" width="528" height="226.323" rx="44.9293" fill="#FDFBFF" shape-rendering="crispEdges"/>
<rect x="694.128" y="741.774" width="531.744" height="230.067" rx="46.8013" stroke="#E3CEFF" stroke-width="3.74411" shape-rendering="crispEdges"/>
<text fill="#3D1EC6" style="white-space: pre" xml:space="preserve" font-family="Spotify Mix" font-size="26.2088" letter-spacing="0.117784px"><tspan x="725.953" y="805.823">Price Change At Checkout Broke </tspan><tspan x="725.953" y="836.712">Trust</tspan></text>
<text fill="#3E0FCB" style="white-space: pre" xml:space="preserve" font-family="Gilroy" font-size="20" font-weight="bold" letter-spacing="0.28px"><tspan x="725.953" y="898.989">The final price increased at checkout, leading </tspan><tspan x="725.953" y="924.989">to hesitation and drop-offs.</tspan></text>
</g>
<g filter="url(#filter6_d_1_9531)">
<rect x="1272" y="200" width="528" height="195.323" rx="44.9293" fill="#FFFBFF" shape-rendering="crispEdges"/>
<rect x="1270.13" y="198.128" width="531.744" height="199.067" rx="46.8013" stroke="#FFCEF5" stroke-width="3.74411" shape-rendering="crispEdges"/>
<text fill="#7A1EC6" style="white-space: pre" xml:space="preserve" font-family="Spotify Mix" font-size="26.2088" letter-spacing="0.117784px"><tspan x="1301.95" y="262.177">Banner Blindness</tspan></text>
<text fill="#920FCB" style="white-space: pre" xml:space="preserve" font-family="Gilroy" font-size="20" letter-spacing="0.28px"><tspan x="1301.95" y="324.362">Users ignored traditional offer placements as </tspan><tspan x="1301.95" y="350.362">they focused on completing their primary task.</tspan></text>
</g>
<g filter="url(#filter7_d_1_9531)">
<rect x="1272" y="443.323" width="528" height="252.323" rx="44.9293" fill="#FFFBFF" shape-rendering="crispEdges"/>
<rect x="1270.13" y="441.451" width="531.744" height="256.067" rx="46.8013" stroke="#FFCEF5" stroke-width="3.74411" shape-rendering="crispEdges"/>
<text fill="#7A1EC6" style="white-space: pre" xml:space="preserve" font-family="Spotify Mix" font-size="26.2088" letter-spacing="0.117784px"><tspan x="1301.95" y="505.5">Lack Of Clarity Around Offers And UI </tspan><tspan x="1301.95" y="536.389">Copy</tspan></text>
<text fill="#920FCB" style="white-space: pre" xml:space="preserve" font-family="Gilroy" font-size="20" letter-spacing="0.28px"><tspan x="1301.95" y="598.685">Even when they saw offers, they didn&#x2019;t </tspan><tspan x="1301.95" y="624.685">understand why they were getting them, which </tspan><tspan x="1301.95" y="650.685">reduced trust.</tspan></text>
</g>
<g filter="url(#filter8_d_1_9531)">
<rect x="1272" y="743.646" width="528" height="252.323" rx="44.9293" fill="#FFFBFF" shape-rendering="crispEdges"/>
<rect x="1270.13" y="741.774" width="531.744" height="256.067" rx="46.8013" stroke="#FFCEF5" stroke-width="3.74411" shape-rendering="crispEdges"/>
<text fill="#7A1EC6" style="white-space: pre" xml:space="preserve" font-family="Spotify Mix" font-size="26.2088" letter-spacing="0.117784px"><tspan x="1301.95" y="805.823">Offers Were Not Consistently </tspan><tspan x="1301.95" y="836.712">Shown</tspan></text>
<text fill="#920FCB" style="white-space: pre" xml:space="preserve" font-family="Gilroy" font-size="20" letter-spacing="0.28px"><tspan x="1301.95" y="899.009">Users did not see the same offer repeated </tspan><tspan x="1301.95" y="925.009">across screens, making it easy to forget or </tspan><tspan x="1301.95" y="951.009">ignore.</tspan></text>
</g>
