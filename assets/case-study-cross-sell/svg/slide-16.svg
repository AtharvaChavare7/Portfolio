<text fill="#0F5ECB" style="white-space: pre" xml:space="preserve" font-family="Gilroy" font-size="20" letter-spacing="-0.08px"><tspan x="1042.5" y="536.48">I became more comfortable evaluating options, choosing a direction, and </tspan><tspan x="1042.5" y="568.48">owning the trade-offs.</tspan></text>
