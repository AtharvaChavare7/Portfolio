<text fill="#0F5ECB" style="white-space: pre" xml:space="preserve" font-family="Gilroy" font-size="20" letter-spacing="-0.08px"><tspan x="1042.5" y="271.48">I learned to factor in engineering limitations, timelines, and system </tspan><tspan x="1042.5" y="303.48">dependencies while designing.</tspan></text>
