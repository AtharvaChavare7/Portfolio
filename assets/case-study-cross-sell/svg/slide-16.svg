<text fill="#1E65C6" style="white-space: pre" xml:space="preserve" font-family="Spotify Mix" font-size="28" letter-spacing="0.125834px"><tspan x="154.5" y="227.426">Stakeholder Management</tspan></text>
<text fill="#0F5ECB" style="white-space: pre" xml:space="preserve" font-family="Gilroy" font-size="20" letter-spacing="-0.08px"><tspan x="154.5" y="271.48">This project involved a diverse group of stakeholders from various teams, </tspan><tspan x="154.5" y="303.48">requiring me to articulate my design decisions to ensure alignment and </tspan><tspan x="154.5" y="335.48">understanding across all parties.</tspan></text>
</g>
