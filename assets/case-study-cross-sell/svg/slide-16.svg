<text fill="#1E65C6" style="white-space: pre" xml:space="preserve" font-family="Spotify Mix" font-size="28" letter-spacing="0.125834px"><tspan x="154.5" y="492.426">Data Informed Decision Making</tspan></text>
<text fill="#0F5ECB" style="white-space: pre" xml:space="preserve" font-family="Gilroy" font-size="20" letter-spacing="-0.08px"><tspan x="154.5" y="536.48">Throughout this project, I became proficient in understanding business metrics </tspan><tspan x="154.5" y="568.48">using them to inform and guide my design decisions.</tspan></text>
</g>
