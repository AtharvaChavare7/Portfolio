<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="clock-favicon.js"></script>
  <meta name="theme-color" content="#ffffff">
  <title>Playground — Hero</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      background: #fff;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      min-height: 100vh;
      background: #fff;
    }

    .hero-sandbox {
      --hero-scale: 1;
      --hero-base-w: 657.641;
      --hero-base-h: 338.473;
      --hero-base-top: 174;
      position: relative;
      width: calc(var(--hero-base-w) * var(--hero-scale) * 1px);
      height: calc(var(--hero-base-h) * var(--hero-scale) * 1px);
      margin: calc(var(--hero-base-top) * var(--hero-scale) * 1px) auto 0;
    }

    .hero-sandbox__content {
      position: absolute;
      top: 0;
      left: 0;
      width: calc(var(--hero-base-w) * 1px);
      height: calc(var(--hero-base-h) * 1px);
      transform: scale(var(--hero-scale));
      transform-origin: top left;
    }

    .hero-sandbox.is-scaling .hero-sandbox__content,
    .hero-sandbox.is-scaling .scale-handle {
      transition: none;
    }

    .scale-handle {
      position: absolute;
      right: -6px;
      bottom: -6px;
      z-index: 20;
      width: 14px;
      height: 14px;
      padding: 0;
      border: 2px solid #148eff;
      border-radius: 2px;
      background: #fff;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.9);
      cursor: nwse-resize;
      touch-action: none;
    }

    .scale-handle::before {
      content: "";
      position: absolute;
      inset: -10px;
    }

    .scale-handle:focus-visible {
      outline: 2px solid #148eff;
      outline-offset: 3px;
    }

    .scale-panel {
      position: fixed;
      z-index: 30;
      bottom: 20px;
      left: 20px;
      width: min(320px, calc(100vw - 40px));
      padding: 14px 16px;
      border: 1px solid rgba(20, 20, 20, 0.1);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 12px 40px rgba(20, 20, 20, 0.1);
      backdrop-filter: blur(12px);
      font: 12px/1.4 ui-sans-serif, system-ui, -apple-system, sans-serif;
      color: #141414;
    }

    .scale-panel h2 {
      margin: 0 0 8px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(20, 20, 20, 0.5);
    }

    .scale-panel__grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px 12px;
      margin-bottom: 12px;
    }

    .scale-panel__grid span {
      display: block;
      font-size: 10px;
      color: rgba(20, 20, 20, 0.45);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .scale-panel__grid strong {
      font-size: 14px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .scale-panel__actions {
      display: flex;
      gap: 8px;
    }

    .scale-panel__btn {
      flex: 1;
      padding: 8px 10px;
      border: 1px solid rgba(20, 20, 20, 0.12);
      border-radius: 999px;
      background: #fff;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }

    .scale-panel__btn:hover {
      background: #f5f5f5;
    }

    .scale-panel__btn--primary {
      border-color: #148eff;
      background: #148eff;
      color: #fff;
    }

    .scale-panel__btn--primary:hover {
      background: #0f7de0;
    }

    .scale-panel__hint {
      margin: 10px 0 0;
      font-size: 11px;
      color: rgba(20, 20, 20, 0.45);
    }

    .hero {
      position: relative;
      width: 657.641px;
      height: 338.473px;
      overflow: visible;
    }

    .hero__layer {
      position: absolute;
    }

    .hero__layer img {
      display: block;
      max-width: none;
    }

    /* Purple steps */
    .hero__purple-steps {
      inset: 156.19px 481.75px 21.46px 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero__purple-steps-inner {
      width: 147.647px;
      height: 164.148px;
      flex-shrink: 0;
      transform: rotate(-85.22deg);
    }

    .hero__purple-steps-inner img {
      width: 147.647px;
      height: 164.148px;
    }

    /* Sparkle star on purple tier */
    .hero__sparkle-star {
      left: 14px;
      top: 103px;
      width: 59.82px;
      height: 59.82px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero__sparkle-star-inner {
      width: 51.672px;
      height: 51.672px;
      transform: rotate(-9.95deg);
    }

    .hero__sparkle-star-inner img {
      width: 51.672px;
      height: 51.672px;
    }

    /* Pink square frame */
    .hero__square-frame {
      left: 199px;
      top: 150px;
      width: 187.02px;
      height: 187.02px;
    }

    .hero__square-frame img {
      width: 187.02px;
      height: 187.02px;
    }

    /* Blue pill — adjusted y: -27px */
    .hero__blue-pill {
      left: 164.957px;
      top: 23.092px;
      width: 148.583px;
      height: 98.179px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero__blue-pill-inner {
      transform: rotate(-11.55deg);
    }

    .hero__blue-pill-shape {
      width: 136.891px;
      height: 72.228px;
      border-radius: 95px;
      background: #148eff;
    }

    /* Yellow star + browser — adjusted y: -36px */
    .hero__sun-star {
      left: 337px;
      top: 0.124px;
      width: 159.221px;
      height: 159.221px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero__sun-star-inner {
      transform: rotate(-16.35deg);
    }

    .hero__sun-star-shape {
      position: relative;
      width: 128.288px;
      height: 128.288px;
    }

    .hero__sun-star-shape > img {
      position: absolute;
      inset: 0;
      width: 128.288px;
      height: 128.288px;
    }

    .hero__browser-wrap {
      position: absolute;
      left: 30.04px;
      top: 33.09px;
      width: 68.186px;
      height: 63.884px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero__browser-inner {
      position: relative;
      width: 54.033px;
      height: 44.457px;
      transform: rotate(26.48deg);
    }

    .hero__browser-inner img {
      width: 54.033px;
      height: 44.457px;
    }

    .hero__browser-dot {
      position: absolute;
      width: 5.472px;
      height: 5.472px;
      border-radius: 13.679px;
      background: #ff9d2d;
    }

    .hero__browser-dot--one {
      left: 4.1px;
      top: 4.79px;
    }

    .hero__browser-dot--two {
      left: 11.63px;
      top: 4.79px;
    }

    /* Pink speech bubble */
    .hero__speech-bubble {
      left: 523px;
      top: 136px;
      width: 134.641px;
      height: 134.641px;
    }

    .hero__speech-bubble img {
      width: 134.641px;
      height: 134.641px;
    }

    /* Green cloud blob */
    .hero__green-figure {
      left: 393px;
      top: 265.905px;
      width: 119.449px;
      height: 88.475px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero__green-figure-inner {
      width: 110px;
      height: 73.339px;
      flex-shrink: 0;
      transform: rotate(-8.31deg);
    }

    .hero__green-figure-inner img {
      width: 110px;
      height: 73.339px;
    }

    /* Green hammer icon */
    .hero__green-cloud {
      left: 425.009px;
      top: 281.616px;
      width: 55.719px;
      height: 53.15px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero__green-cloud-inner {
      position: relative;
      width: 52.741px;
      height: 44.438px;
      flex-shrink: 0;
      transform: rotate(-11.63deg);
    }

    .hero__green-cloud-inner img {
      position: absolute;
      left: -5.24%;
      top: 0;
      width: 110.48%;
      height: 100%;
    }

    /* Cursor sparkles */
    .hero__spark--1 {
      left: 579px;
      top: 177px;
      width: 1px;
      height: 1px;
    }

    .hero__spark--1 img {
      position: absolute;
      inset: -150%;
      width: 400%;
      height: 400%;
    }

    .hero__spark--2 {
      left: 585.09px;
      top: 171px;
      width: 2.183px;
      height: 3.116px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero__spark--2-inner {
      position: relative;
      width: 1.347px;
      height: 2.834px;
      transform: rotate(18.66deg);
    }

    .hero__spark--2-inner img {
      position: absolute;
      inset: -52.95% -111.35%;
      width: 322.7%;
      height: 205.9%;
    }

    .hero__spark--3 {
      left: 593px;
      top: 169px;
      width: 4.105px;
      height: 4.3px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero__spark--3-inner {
      position: relative;
      width: 2.5px;
      height: 3.5px;
      transform: rotate(37.08deg);
    }

    .hero__spark--3-inner img {
      position: absolute;
      inset: -42.86% -60%;
      width: 220%;
      height: 185.72%;
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="hero-sandbox" id="hero-sandbox">
      <div class="hero-sandbox__content" id="hero-sandbox-content">
        <section class="hero" aria-label="Hero illustration">
      <div class="hero__layer hero__purple-steps">
        <div class="hero__purple-steps-inner">
          <img src="assets/playground/hero/purple-steps.svg" alt="">
        </div>
      </div>

      <div class="hero__layer hero__sparkle-star">
        <div class="hero__sparkle-star-inner">
          <img src="assets/playground/hero/star-small.svg" alt="">
        </div>
      </div>

      <div class="hero__layer hero__square-frame">
        <img src="assets/playground/hero/square-frame.svg" alt="">
      </div>

      <div class="hero__layer hero__blue-pill">
        <div class="hero__blue-pill-inner">
          <div class="hero__blue-pill-shape" aria-hidden="true"></div>
        </div>
      </div>

      <div class="hero__layer hero__sun-star">
        <div class="hero__sun-star-inner">
          <div class="hero__sun-star-shape">
            <img src="assets/playground/hero/star.svg" alt="">
            <div class="hero__browser-wrap">
              <div class="hero__browser-inner">
                <img src="assets/playground/hero/star-browser.svg" alt="">
                <span class="hero__browser-dot hero__browser-dot--one" aria-hidden="true"></span>
                <span class="hero__browser-dot hero__browser-dot--two" aria-hidden="true"></span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="hero__layer hero__speech-bubble">
        <img src="assets/playground/hero/speech-bubble.svg" alt="">
      </div>

      <div class="hero__layer hero__green-figure">
        <div class="hero__green-figure-inner">
          <img src="assets/playground/hero/figure-green.svg" alt="">
        </div>
      </div>

      <div class="hero__layer hero__green-cloud">
        <div class="hero__green-cloud-inner">
          <img src="assets/playground/hero/green-cloud.svg" alt="">
        </div>
      </div>

      <div class="hero__layer hero__spark--1">
        <img src="assets/playground/hero/cursor-spark-1.svg" alt="">
      </div>

      <div class="hero__layer hero__spark--2">
        <div class="hero__spark--2-inner">
          <img src="assets/playground/hero/cursor-spark-2.svg" alt="">
        </div>
      </div>

      <div class="hero__layer hero__spark--3">
        <div class="hero__spark--3-inner">
          <img src="assets/playground/hero/cursor-spark-3.svg" alt="">
        </div>
      </div>
        </section>
      </div>
      <button type="button" class="scale-handle" id="scale-handle" aria-label="Scale sandbox proportionally"></button>
    </div>
  </main>

  <aside class="scale-panel" id="scale-panel" aria-label="Sandbox scale controls">
    <h2>Sandbox scale</h2>
    <div class="scale-panel__grid">
      <div>
        <span>Scale</span>
        <strong id="scale-readout">1</strong>
      </div>
      <div>
        <span>Width</span>
        <strong id="width-readout">657.641px</strong>
      </div>
      <div>
        <span>Height</span>
        <strong id="height-readout">338.473px</strong>
      </div>
      <div>
        <span>Top offset</span>
        <strong id="top-readout">174px</strong>
      </div>
    </div>
    <div class="scale-panel__actions">
      <button type="button" class="scale-panel__btn" id="scale-reset">Reset</button>
      <button type="button" class="scale-panel__btn scale-panel__btn--primary" id="scale-copy">Copy values</button>
    </div>
    <p class="scale-panel__hint">Drag the blue corner handle to scale like Figma (K). Paste copied values in chat when done.</p>
  </aside>

  <script>
    (function () {
      const BASE_W = 657.641;
      const BASE_H = 338.473;
      const BASE_TOP = 174;
      const MIN_SCALE = 0.35;
      const MAX_SCALE = 2.5;
      const STORAGE_KEY = "playground-hero-scale";

      const sandbox = document.getElementById("hero-sandbox");
      const handle = document.getElementById("scale-handle");
      const scaleReadout = document.getElementById("scale-readout");
      const widthReadout = document.getElementById("width-readout");
      const heightReadout = document.getElementById("height-readout");
      const topReadout = document.getElementById("top-readout");
      const copyBtn = document.getElementById("scale-copy");
      const resetBtn = document.getElementById("scale-reset");

      let scale = 1;
      let dragging = false;
      let anchorX = 0;
      let anchorY = 0;

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function round(value, digits) {
        return Number(value.toFixed(digits));
      }

      function applyScale(nextScale) {
        scale = clamp(nextScale, MIN_SCALE, MAX_SCALE);
        sandbox.style.setProperty("--hero-scale", String(scale));
        scaleReadout.textContent = round(scale, 4);
        widthReadout.textContent = round(BASE_W * scale, 3) + "px";
        heightReadout.textContent = round(BASE_H * scale, 3) + "px";
        topReadout.textContent = round(BASE_TOP * scale, 3) + "px";
        localStorage.setItem(STORAGE_KEY, String(scale));
      }

      function exportValues() {
        return {
          scale: round(scale, 4),
          width: round(BASE_W * scale, 3),
          height: round(BASE_H * scale, 3),
          marginTop: round(BASE_TOP * scale, 3),
          baseWidth: BASE_W,
          baseHeight: BASE_H,
          baseMarginTop: BASE_TOP
        };
      }

      function loadSaved() {
        const saved = Number(localStorage.getItem(STORAGE_KEY));
        if (saved && !Number.isNaN(saved)) {
          applyScale(saved);
        } else {
          applyScale(1);
        }
      }

      handle.addEventListener("pointerdown", (event) => {
        dragging = true;
        const rect = sandbox.getBoundingClientRect();
        anchorX = rect.left;
        anchorY = rect.top;
        sandbox.classList.add("is-scaling");
        handle.setPointerCapture(event.pointerId);
        event.preventDefault();
      });

      handle.addEventListener("pointermove", (event) => {
        if (!dragging) return;
        const width = event.clientX - anchorX;
        const height = event.clientY - anchorY;
        const nextScale = Math.max(width / BASE_W, height / BASE_H);
        applyScale(nextScale);
      });

      function endDrag(event) {
        if (!dragging) return;
        dragging = false;
        sandbox.classList.remove("is-scaling");
        if (event.pointerId) {
          handle.releasePointerCapture(event.pointerId);
        }
      }

      handle.addEventListener("pointerup", endDrag);
      handle.addEventListener("pointercancel", endDrag);

      resetBtn.addEventListener("click", () => applyScale(1));

      copyBtn.addEventListener("click", async () => {
        const payload = exportValues();
        const text = JSON.stringify(payload, null, 2);
        try {
          await navigator.clipboard.writeText(text);
          copyBtn.textContent = "Copied!";
          window.setTimeout(() => {
            copyBtn.textContent = "Copy values";
          }, 1400);
        } catch (_) {
          const textarea = document.createElement("textarea");
          textarea.value = text;
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand("copy");
          textarea.remove();
          copyBtn.textContent = "Copied!";
          window.setTimeout(() => {
            copyBtn.textContent = "Copy values";
          }, 1400);
        }
      });

      loadSaved();
    })();
  </script>
</body>
</html>
